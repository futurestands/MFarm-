apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'dev.mfarm.com.mfarm'
    compileSdk 33

    defaultConfig {
        applicationId "dev.mfarm.com.mfarm"
        minSdk 21
        targetSdk 33
        versionCode 3
        versionName "1.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [exportedForTesting: "false"]
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties.getProperty('KEYSTORE_FILE') != null) {
                storeFile rootProject.file(keystoreProperties.getProperty('KEYSTORE_FILE'))
                storePassword keystoreProperties.getProperty('KEYSTORE_PASSWORD')
                keyAlias keystoreProperties.getProperty('KEY_ALIAS')
                keyPassword keystoreProperties.getProperty('KEY_PASSWORD')
            } else if (project.hasProperty('KEYSTORE_FILE')) {
                storeFile rootProject.file(project.property('KEYSTORE_FILE'))
                storePassword project.property('KEYSTORE_PASSWORD')
                keyAlias project.property('KEY_ALIAS')
                keyPassword project.property('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            manifestPlaceholders = [exportedForTesting: "true"]
        }
        release {
            manifestPlaceholders = [exportedForTesting: "false"]
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'

    // Firebase BoM & Core Services
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.xerial:sqlite-jdbc:3.42.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
